name: Build iOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Prepare Capacitor iOS project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios --save-dev
          npx cap add ios || true
          npx cap sync ios

      - name: Install CocoaPods deps
        working-directory: ios/App
        run: pod install --repo-update

      - name: Build iOS Simulator app
        working-directory: ios/App
        run: |
          set -e
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package simulator app into .ipa
        run: |
          set -e
          APP_PATH=$(find ios/App/build -name "App.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/App.app
          zip -r -q Smooli-sim.ipa Payload
          ls -lh Smooli-sim.ipa

      - name: Upload simulator IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smooli-iOS-Simulator
          path: Smooli-sim.ipa
          retention-days: 7

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Smooli-App
          path: ios/App/build/**/*.app
          if-no-files-found: warn
          retention-days: 7
